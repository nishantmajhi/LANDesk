  <line x1="128" y1="128" x2="196" y2="46"  stroke="#2196F3" stroke-width="6" stroke-linecap="round"/>
  <line x1="128" y1="128" x2="214" y2="150" stroke="#66BB6A" stroke-width="6" stroke-linecap="round"/>
